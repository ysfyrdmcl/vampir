<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error": "#ffb4ab",
                    "surface-container": "#201f1f",
                    "surface-container-highest": "#353534",
                    "on-tertiary-container": "#b9ad9b",
                    "outline": "#aa8984",
                    "secondary-container": "#af8d11",
                    "surface-tint": "#ffb4a8",
                    "on-secondary-fixed": "#241a00",
                    "on-primary-container": "#ff907f",
                    "primary": "#ffb4a8",
                    "error-container": "#93000a",
                    "on-surface": "#e5e2e1",
                    "outline-variant": "#5a403c",
                    "background": "#131313",
                    "on-error-container": "#ffdad6",
                    "surface-dim": "#131313",
                    "on-primary-fixed-variant": "#920703",
                    "on-tertiary": "#372f23",
                    "surface-container-high": "#2a2a2a",
                    "on-tertiary-fixed": "#211b0f",
                    "secondary-fixed-dim": "#e9c349",
                    "inverse-on-surface": "#313030",
                    "tertiary-fixed": "#eee1ce",
                    "tertiary-container": "#494133",
                    "inverse-primary": "#b52619",
                    "on-primary": "#690000",
                    "on-error": "#690005",
                    "on-tertiary-fixed-variant": "#4e4638",
                    "secondary": "#e9c349",
                    "on-secondary-container": "#342800",
                    "inverse-surface": "#e5e2e1",
                    "surface-container-lowest": "#0e0e0e",
                    "surface-variant": "#353534",
                    "primary-container": "#8b0000",
                    "on-secondary": "#3c2f00",
                    "on-surface-variant": "#e3beb8",
                    "secondary-fixed": "#ffe088",
                    "surface-container-low": "#1c1b1b",
                    "on-background": "#e5e2e1",
                    "on-primary-fixed": "#410000",
                    "surface-bright": "#3a3939",
                    "primary-fixed-dim": "#ffb4a8",
                    "surface": "#131313",
                    "tertiary-fixed-dim": "#d1c5b3",
                    "on-secondary-fixed-variant": "#574500",
                    "primary-fixed": "#ffdad4",
                    "tertiary": "#d1c5b3"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xl": "32px",
                    "safe-margin": "20px",
                    "lg": "24px",
                    "md": "16px",
                    "sm": "8px",
                    "unit": "4px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "label-caps": ["Manrope"],
                    "h2": ["Newsreader"],
                    "h1": ["Newsreader"],
                    "body-sm": ["Manrope"],
                    "body-lg": ["Manrope"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "h1": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400"}],
                    "body-lg": ["17px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .parchment-texture {
            background-color: #eee1ce;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3Y%3Cfilter id='noiseFilter'%3Y%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            box-shadow: inset 0 0 80px rgba(139, 69, 19, 0.15);
        }
        .blood-gradient {
            background: linear-gradient(180deg, #b52619 0%, #8b0000 100%);
        }
        .etched-border {
            border: 1px solid rgba(139, 0, 0, 0.2);
        }
        .moonlight-glow {
            background: radial-gradient(circle at center, rgba(175, 141, 17, 0.08) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-lg">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-5 h-16 w-full fixed top-0 z-50 bg-neutral-950 dark:bg-black/95 border-b border-yellow-900/20 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-red-800 dark:text-red-700" data-icon="shield">shield</span>
<h1 class="text-lg font-bold text-red-800 dark:text-red-700 font-newsreader uppercase tracking-widest">Gündüz Fazı</h1>
</div>
<div class="text-neutral-500 font-label-caps text-label-caps">#XJ82K1</div>
</header>
<main class="pt-24 pb-32 px-safe-margin max-w-lg mx-auto moonlight-glow min-h-screen">
<!-- Screen Title -->
<div class="mb-lg text-center">
<h2 class="font-h1 text-h1 text-on-surface mb-xs">Oda Kur</h2>
<div class="h-1 w-12 bg-primary-container mx-auto rounded-full"></div>
</div>
<!-- Room Settings Card (Parchment) -->
<section class="parchment-texture p-lg rounded-xl mb-xl relative overflow-hidden shadow-2xl">
<div class="absolute inset-0 border-[12px] border-double border-tertiary-container/10 pointer-events-none"></div>
<div class="relative z-10">
<div class="flex items-center justify-between mb-md border-b border-tertiary-container/20 pb-sm">
<span class="font-label-caps text-label-caps text-on-tertiary uppercase">Oyun Modu</span>
<span class="font-h2 text-h2 text-on-tertiary-fixed-variant">Klasik Korku</span>
</div>
<div class="mb-lg">
<label class="font-label-caps text-label-caps text-on-tertiary uppercase block mb-xs">Oyuncu Sayısı</label>
<div class="flex items-center justify-between bg-black/5 p-md rounded-lg etched-border">
<button class="material-symbols-outlined text-on-tertiary-fixed-variant hover:text-primary-container transition-all" data-icon="remove_circle">remove_circle</button>
<div class="text-center">
<span class="font-h1 text-h1 text-on-tertiary-fixed-variant block">12</span>
<span class="font-label-caps text-[10px] text-tertiary-container uppercase">Min 4 • Max 20</span>
</div>
<button class="material-symbols-outlined text-on-tertiary-fixed-variant hover:text-primary-container transition-all" data-icon="add_circle">add_circle</button>
</div>
</div>
<div class="space-y-md">
<div class="flex items-center justify-between">
<span class="font-body-lg text-on-tertiary-fixed-variant">Gizli Roller</span>
<div class="w-10 h-5 bg-tertiary-container rounded-full relative">
<div class="absolute right-0.5 top-0.5 w-4 h-4 bg-tertiary rounded-full"></div>
</div>
</div>
<div class="flex items-center justify-between">
<span class="font-body-lg text-on-tertiary-fixed-variant">Hızlı Tur (60sn)</span>
<div class="w-10 h-5 bg-neutral-300 rounded-full relative">
<div class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</div>
</div>
</div>
</div>
</section>
<!-- Room Code Display -->
<section class="bg-surface-container-high p-lg rounded-xl border border-yellow-900/20 mb-lg text-center relative overflow-hidden">
<div class="absolute top-0 right-0 p-2 opacity-10">
<span class="material-symbols-outlined text-[80px]" data-icon="qr_code_2">qr_code_2</span>
</div>
<p class="font-label-caps text-label-caps text-outline uppercase mb-sm">Oda Kodu</p>
<div class="font-h1 text-[48px] tracking-[0.2em] text-secondary font-bold mb-md">482913</div>
<button class="flex items-center justify-center gap-xs mx-auto text-primary text-body-sm hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-sm" data-icon="content_copy">content_copy</span>
                Kopyala
            </button>
</section>
<!-- Action Buttons -->
<div class="space-y-md">
<button class="blood-gradient w-full py-md rounded-lg font-h2 text-h2 text-tertiary-fixed shadow-[0_4px_12px_rgba(139,0,0,0.4)] border-t border-red-400/30 active:scale-95 transition-all">
                Odayı Oluştur
            </button>
<button class="w-full py-md rounded-lg font-h2 text-h2 text-on-surface border border-outline-variant bg-surface-container-lowest/50 hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="hourglass_empty">hourglass_empty</span>
                Oyuncuları Bekle
            </button>
</div>
<!-- Decorative Element -->
<div class="mt-xl flex justify-center opacity-20">
<img class="w-24 h-auto opacity-50" data-alt="A detailed digital painting of a gothic iron candle holder with three flickering candles casting a warm orange light against a cold, dark stone wall background. The style is moody and atmospheric with a heavy vignette, echoing the vampire social deduction theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXR0ntrjp20GLvp6oJu5Fl8wBzjY68QS99NF10nzSdbwePh_KddsXtdgBhFJbgc1IclqLgyrhp5w_5YlxWS6Z88uywd8xheWK9PM1tfLq6XrUIDQW2acYaR2ashHl_0aBJtN_WdiA80ACz4XmfXur7U_zC4r3ZMCdcKLZQEa9Pa5NZbpI1lH2Voao_shbbfHzat-OB33F6lGgWmjclrQSrYru9THUIRYdqF2jkxrjzLXhU1FZvtFYD9mKnkrmQinLCcMZkse47bg"/>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe bg-neutral-950 dark:bg-black/95 border-t border-yellow-900/20 shadow-[0_-4px_20px_rgba(0,0,0,0.9)]">
<div class="flex flex-col items-center justify-center text-neutral-600 p-2 hover:text-red-500 transition-all">
<span class="material-symbols-outlined" data-icon="castle">castle</span>
<span class="font-newsreader text-[10px] tracking-tight uppercase">Kale</span>
</div>
<div class="flex flex-col items-center justify-center text-red-600 drop-shadow-[0_0_8px_rgba(139,0,0,0.6)] p-2">
<span class="material-symbols-outlined" data-icon="history_edu" style="font-variation-settings: 'FILL' 1;">history_edu</span>
<span class="font-newsreader text-[10px] tracking-tight uppercase">Yazıtlar</span>
</div>
<div class="flex flex-col items-center justify-center text-neutral-600 p-2 hover:text-red-500 transition-all">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-newsreader text-[10px] tracking-tight uppercase">Meclis</span>
</div>
<div class="flex flex-col items-center justify-center text-neutral-600 p-2 hover:text-red-500 transition-all">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-newsreader text-[10px] tracking-tight uppercase">Ayarlar</span>
</div>
</nav>
</body></html>
