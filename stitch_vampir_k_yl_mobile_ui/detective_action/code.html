</div>
<div class="text-neutral-500 font-label-caps tracking-tighter">#XJ82K1</div>
</header>
<main class="pt-24 pb-32 px-safe-margin min-h-screen relative overflow-hidden moonlight-glow">

<circle class="text-primary-container" cx="40" cy="40" fill="transparent" r="36" stroke="currentColor" stroke-dasharray="226" stroke-dashoffset="40" stroke-width="2"></circle>
</svg>

</div>
<p class="mt-sm font-label-caps text-on-tertiary-container">DÜŞÜNME SÜRESİ</p>
</div>

<div class="absolute bottom-3 left-3 right-3 z-20 flex flex-col items-start">
<span class="font-label-caps text-[10px] text-secondary mb-1">DURUM: CANLI</span>
<span class="font-h2 text-white text-lg">Kerem G.</span>
</div>
</button>
<!-- Card with Selection Glow -->
<button class="relative group aspect-[3/4] rounded-lg overflow-hidden border-2 border-primary-container player-card-shadow bg-surface-container-high transition-all ring-4 ring-primary-container/20 active:scale-95">

</div>
<div class="absolute bottom-3 left-3 right-3 z-20 flex flex-col items-start">
<span class="font-label-caps text-[10px] text-secondary mb-1">DURUM: CANLI</span>
<span class="font-h2 text-white text-lg">Aylin S.</span>
</div>

<div class="flex flex-col items-center text-center relative z-10">

<p class="font-h2 text-2xl text-stone-800 italic mb-xl">
                    "Sonuç: Bu oyuncu <span class="text-primary-container font-bold">Vampir değil</span>"
                </p>

</button>
<button class="flex flex-col items-center justify-center text-red-600 drop-shadow-[0_0_8px_rgba(139,0,0,0.6)] p-2 hover:text-red-500 transition-all">
<span class="material-symbols-outlined" data-icon="history_edu" style="font-variation-settings: 'FILL' 1;">history_edu</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-600 p-2 hover:text-red-500 transition-all">
<span class="material-symbols-outlined" data-icon="group">group</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-600 p-2 hover:text-red-500 transition-all">
