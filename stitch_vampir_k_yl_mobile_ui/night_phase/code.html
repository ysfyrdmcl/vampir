<body class="bg-background text-on-surface font-body-lg min-h-screen selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-5 h-16 w-full fixed top-0 z-50 bg-neutral-950 dark:bg-black/95 docked full-width top-0 border-b border-yellow-900/20 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">

<span class="material-symbols-outlined text-red-800 dark:text-red-700" data-icon="shield">shield</span>
<h1 class="font-newsreader uppercase tracking-widest text-lg font-bold text-red-800 dark:text-red-700 font-newsreader">Gündüz Fazı</h1>
</div>
<div class="text-neutral-500 font-label-caps tracking-widest border border-yellow-900/30 px-3 py-1 rounded">
            #XJ82K1
        </div>
</header>
<main class="relative h-screen flex flex-col items-center justify-center pt-16 pb-20 moonlight-glow">
<!-- Ambient Atmosphere -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-tertiary-container rounded-full blur-[100px]"></div>
</div>
<!-- Central Phase Content -->
<div class="relative z-10 flex flex-col items-center text-center px-safe-margin max-w-md w-full">
<!-- Phase Header -->
<div class="mb-lg">
<span class="font-label-caps text-on-tertiary-container tracking-[0.3em] uppercase block mb-sm">Aşama</span>
<h2 class="font-h1 text-h1 text-on-surface tracking-tighter">Gece</h2>
</div>
<!-- Glowing Moon Icon Container -->
<div class="relative mb-xl flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-3xl animate-pulse"></div>
<div class="w-48 h-48 rounded-full border border-yellow-900/10 flex items-center justify-center bg-surface-container-low shadow-[0_0_60px_rgba(139,0,0,0.2)]">
<span class="material-symbols-outlined text-red-700 !text-[80px]" data-icon="dark_mode" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
</div>
<!-- Orbits/Particles -->
<div class="absolute inset-0 border border-yellow-900/5 rounded-full scale-125"></div>
<div class="absolute inset-0 border border-yellow-900/5 rounded-full scale-150 opacity-50"></div>
</div>
<!-- Main Instruction Card -->
<div class="w-full parchment-texture p-lg rounded-xl shadow-2xl mb-lg border border-yellow-900/20 transform -rotate-1">
<p class="font-h2 text-h2 text-on-tertiary etched-text mb-sm">
                    Herkes gözlerini kapatsın
                </p>
<div class="h-px w-1/2 mx-auto bg-tertiary-container/30 mb-sm"></div>
<p class="font-body-sm text-on-tertiary-fixed-variant italic">
                    “Köy derin bir sessizliğe bürünüyor...”
                </p>
</div>
<!-- Timer Countdown -->
<div class="flex flex-col items-center gap-sm">
<div class="relative w-16 h-16 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-surface-container-highest" cx="32" cy="32" fill="none" r="30" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-red-800" cx="32" cy="32" fill="none" r="30" stroke="currentColor" stroke-dasharray="188.4" stroke-dashoffset="47.1" stroke-width="3"></circle>
</svg>
<span class="font-h2 text-h2 text-red-700">10</span>
</div>
<span class="font-label-caps text-on-surface-variant text-[10px]">SANİYE KALDI</span>
</div>
</div>

<div class="absolute inset-0 -z-10 opacity-30 mix-blend-luminosity">

<span class="font-newsreader text-[10px] tracking-tight">KÖY</span>
</a>
